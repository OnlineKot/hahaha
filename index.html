<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYD — Interfejs Pojazdu</title>
<style>
  :root {
    --bg: #05060a;
    --panel: rgba(15, 22, 40, 0.55);
    --accent: #3aa0ff;
    --accent-2: #1e5fd6;
    --glow: rgba(58, 160, 255, 0.55);
    --text: #dbe7ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #0a1224 0%, #05060a 70%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* --- Tło: fale graficzne --- */
  #waves {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* --- Niebieski, niedopracowany śledzący element --- */
  #tracker {
    position: fixed;
    top: 0; left: 0;
    width: 90px;
    height: 90px;
    z-index: 1;
    pointer-events: none;
    will-change: transform;
  }
  #tracker .blob {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 40% 35%, #6fbaff, #1e5fd6 60%, #0b2a5e 100%);
    /* celowo "niedopracowany" — koślawy, nierówny kształt */
    border-radius: 47% 53% 40% 60% / 55% 42% 58% 45%;
    box-shadow: 0 0 40px 10px var(--glow), inset 0 0 20px rgba(255,255,255,0.25);
    opacity: 0.85;
    animation: wobble 3.4s ease-in-out infinite;
    filter: blur(0.4px);
  }
  #tracker .ring {
    position: absolute;
    inset: -18px;
    border: 2px dashed rgba(120, 190, 255, 0.5);
    border-radius: 50%;
    animation: spin 6s linear infinite;
  }
  @keyframes wobble {
    0%,100% { border-radius: 47% 53% 40% 60% / 55% 42% 58% 45%; }
    50%     { border-radius: 60% 40% 55% 45% / 42% 60% 40% 58%; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- Interfejs --- */
  .hud {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(4px);
  }
  header h1 {
    font-size: 18px;
    letter-spacing: 3px;
    font-weight: 600;
    text-transform: uppercase;
    color: #9fc7ff;
  }
  header .status {
    font-size: 12px;
    letter-spacing: 1px;
    color: #6d8fc4;
  }
  header .status b { color: #4fd08a; }

  /* Panel wskaźników */
  .gauges {
    display: flex;
    gap: 40px;
    justify-content: center;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .gauge {
    text-align: center;
    min-width: 90px;
  }
  .gauge .val {
    font-size: 34px;
    font-weight: 700;
    color: #eaf3ff;
    text-shadow: 0 0 14px var(--glow);
    font-variant-numeric: tabular-nums;
  }
  .gauge .lbl {
    font-size: 11px;
    letter-spacing: 2px;
    color: #6d8fc4;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* Trzy duże kółka sterujące */
  .controls {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 6vw, 90px);
    flex-wrap: wrap;
    padding: 20px;
  }
  .wheel {
    position: relative;
    width: clamp(150px, 22vw, 230px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--panel);
    border: 2px solid rgba(90, 150, 230, 0.35);
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(58,160,255,0.1);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    touch-action: none;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .wheel:active { cursor: grabbing; }
  .wheel.active {
    border-color: var(--accent);
    box-shadow: 0 10px 50px rgba(0,0,0,0.6), 0 0 60px var(--glow), inset 0 0 30px rgba(58,160,255,0.25);
  }
  .wheel .knob {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    margin: -10px 0 0 -10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 20px var(--glow);
  }
  .wheel .dial {
    width: 62%;
    height: 62%;
    border-radius: 50%;
    border: 1px solid rgba(120,180,255,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .wheel .dial .name {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #8fb4ec;
  }
  .wheel .dial .num {
    font-size: 28px;
    font-weight: 700;
    color: #eaf3ff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px var(--glow);
  }
  .wheel::before {
    /* podziałka */
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background:
      repeating-conic-gradient(rgba(120,180,255,0.22) 0deg 1deg, transparent 1deg 30deg);
    -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%);
            mask: radial-gradient(circle, transparent 62%, #000 63%);
  }

  footer {
    text-align: center;
    padding: 14px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #55749f;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: #6d8fc4;
    margin-bottom: 6px;
  }
</style>
</head>
<body>
  <canvas id="waves"></canvas>

  <div id="tracker">
    <div class="ring"></div>
    <div class="blob"></div>
  </div>

  <div class="hud">
    <header>
      <h1>BYD · Build Your Dreams</h1>
      <div class="status">NAPĘD: <b>EV</b> · TRYB: NORMAL</div>
    </header>

    <div class="gauges">
      <div class="gauge"><div class="val" id="g-speed">0</div><div class="lbl">km/h</div></div>
      <div class="gauge"><div class="val" id="g-power">0</div><div class="lbl">kW moc</div></div>
      <div class="gauge"><div class="val" id="g-range">410</div><div class="lbl">km zasięg</div></div>
      <div class="gauge"><div class="val" id="g-batt">100</div><div class="lbl">% bateria</div></div>
    </div>

    <div class="hint">Chwyć i obróć duże kółka, aby sterować pojazdem BYD</div>

    <div class="controls">
      <div class="wheel" data-ctl="gaz" data-min="0" data-max="100">
        <div class="knob"></div>
        <div class="dial"><div class="name">Pedał</div><div class="num">0</div></div>
      </div>
      <div class="wheel" data-ctl="skret" data-min="-45" data-max="45">
        <div class="knob"></div>
        <div class="dial"><div class="name">Skręt</div><div class="num">0</div></div>
      </div>
      <div class="wheel" data-ctl="tryb" data-min="1" data-max="3">
        <div class="knob"></div>
        <div class="dial"><div class="name">Tryb</div><div class="num">ECO</div></div>
      </div>
    </div>

    <footer>BYD VEHICLE INTERFACE · v0.1 (koncept) · GitHub Pages</footer>
  </div>

<script>
/* ---------- Fale graficzne w tle ---------- */
const cv = document.getElementById('waves');
const ctx = cv.getContext('2d');
let W, H;
function resize() {
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const waveLayers = [
  { amp: 55, len: 0.008, speed: 0.9, y: 0.72, color: 'rgba(30, 95, 214, 0.35)' },
  { amp: 40, len: 0.012, speed: 1.4, y: 0.80, color: 'rgba(58, 160, 255, 0.28)' },
  { amp: 28, len: 0.02,  speed: 2.1, y: 0.88, color: 'rgba(111, 186, 255, 0.22)' },
];

let t = 0;
let speedFactor = 0; // rośnie z "gazem"

function drawWaves() {
  ctx.clearRect(0, 0, W, H);
  waveLayers.forEach((wl) => {
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 6) {
      const y = H * wl.y
        + Math.sin(x * wl.len + t * wl.speed) * wl.amp
        + Math.sin(x * wl.len * 0.5 + t * wl.speed * 0.6) * wl.amp * 0.4;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fillStyle = wl.color;
    ctx.fill();
  });
  t += 0.015 + speedFactor * 0.05;
  requestAnimationFrame(drawWaves);
}
drawWaves();

/* ---------- Niebieski, niedopracowany element śledzący ---------- */
const tracker = document.getElementById('tracker');
let tx = window.innerWidth / 2, ty = window.innerHeight / 2;
let px = tx, py = ty;

function moveTracker(x, y) { tx = x; ty = y; }
window.addEventListener('mousemove', e => moveTracker(e.clientX, e.clientY));
window.addEventListener('touchmove', e => {
  if (e.touches[0]) moveTracker(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

function followLoop() {
  // celowo "leniwe"/niedopracowane podążanie — z opóźnieniem i drganiem
  px += (tx - px) * 0.06;
  py += (ty - py) * 0.06;
  const jitter = Math.sin(Date.now() / 180) * 4; // lekkie drganie
  tracker.style.transform =
    'translate(' + (px + jitter) + 'px,' + (py - jitter) + 'px) translate(-50%,-50%)';
  requestAnimationFrame(followLoop);
}
followLoop();

/* ---------- Duże kółka sterujące ---------- */
const state = { gaz: 0, skret: 0, tryb: 1 };
const TRYBY = { 1: 'ECO', 2: 'NORMAL', 3: 'SPORT' };

document.querySelectorAll('.wheel').forEach(wheel => {
  const ctl = wheel.dataset.ctl;
  const min = parseFloat(wheel.dataset.min);
  const max = parseFloat(wheel.dataset.max);
  const knob = wheel.querySelector('.knob');
  const num = wheel.querySelector('.num');
  let dragging = false;

  function setFromAngle(clientX, clientY) {
    const r = wheel.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    let ang = Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI + 90;
    if (ang < 0) ang += 360;                 // 0..360
    const usable = Math.min(ang, 300);       // martwa strefa 300..360 na dole
    let val = min + (usable / 300) * (max - min);
    val = Math.round(val);
    state[ctl] = val;
    render();
  }

  function render() {
    const val = state[ctl];
    num.textContent = (ctl === 'tryb') ? TRYBY[val] : val;
    const frac = (val - min) / (max - min);
    const deg = frac * 300;                   // 0 = góra, w prawo
    const rad = (deg - 90) * Math.PI / 180;   // pozycja gałki na obwodzie
    const R = wheel.clientWidth / 2 - 18;
    const kx = Math.cos(rad) * R;
    const ky = Math.sin(rad) * R;
    knob.style.transform = 'translate(' + kx + 'px,' + ky + 'px)';
  }

  function start(e) {
    dragging = true;
    wheel.classList.add('active');
    move(e);
  }
  function move(e) {
    if (!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    setFromAngle(p.clientX, p.clientY);
    if (e.cancelable) e.preventDefault();
  }
  function end() { dragging = false; wheel.classList.remove('active'); }

  wheel.addEventListener('mousedown', start);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  wheel.addEventListener('touchstart', start, { passive: false });
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', end);

  render();
});

/* ---------- Symulacja wskaźników (EV) ---------- */
const gSpeed = document.getElementById('g-speed');
const gPower = document.getElementById('g-power');
const gRange = document.getElementById('g-range');
const gBatt  = document.getElementById('g-batt');

let speed = 0, power = 0, batt = 100;
const FULL_RANGE = 410; // km przy 100%

setInterval(() => {
  const throttle = state.gaz / 100;
  // ECO=1, NORMAL=2, SPORT=3 — więcej mocy i osiągów w wyższym trybie
  const modeGain = { 1: 0.7, 2: 1.0, 3: 1.4 }[state.tryb];
  const maxSpeed = 180 * modeGain;

  const targetSpeed = throttle * maxSpeed;
  speed += (targetSpeed - speed) * 0.08;

  // moc silnika elektrycznego (kW), z rekuperacją przy puszczonym pedale
  const targetPower = throttle > 0.02 ? throttle * 230 * modeGain : -speed * 0.4;
  power += (targetPower - power) * 0.15;

  // zużycie baterii zależne od mocy pobieranej
  batt = Math.max(0, batt - Math.max(0, power) * 0.00016);

  speedFactor = speed / 220; // wpływ na fale w tle

  gSpeed.textContent = Math.round(speed);
  gPower.textContent = Math.round(power);
  gRange.textContent = Math.round(FULL_RANGE * batt / 100);
  gBatt.textContent  = batt.toFixed(1);
}, 60);
</script>
</body>
</html>
